services:

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    hostname: cassandra

    ports:
      - "9042:9042"

    environment:
      CASSANDRA_CLUSTER_NAME: tp-cassandra
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16

      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M

    volumes:
      - cassandra_data:/var/lib/cassandra

    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab5-extractor:local
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cassandra_data: